name: QA Database Integrity & SQL Validation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-sql-qa-validations:
    name: Run Database Quality Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute QA SQL Validations Runner
        run: |
          python sql/run_validations.py

      - name: Run Automated Database Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"
